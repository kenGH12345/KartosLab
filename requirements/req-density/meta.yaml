edd_template_version: v2.0

design_constraints:
  - MVC：State / PhysicsSolver / Controller / RenderData / Painter / Widget / Screen
  - NineGrid 只负责页面级布局；实验画布保留 World→Viewport 变换
  - 不机械套用 Buoyancy 的流体切换 / 力矢量 / 船瓶场景
  - 不修改其它已完成 simulation
  - 原版源码优先于网页文案与物理常识
  - Mystery Set / Compare BlockSet 配置驱动，禁止 if (set == 1) 散落 Painter
  - 禁止 WebView / iframe / 截图伪装 / JS runtime
  - L0 复用 lib/common/；p2.js 与 THREE.js 不迁入，用 Dart Solver + CustomPainter 行为等价
  - 改编标识 Adapted from PhET · 保留 GPL-3.0 与纹理 CC0 署名
  - 接入路径为本工程惯例 lib/density/（不是 prompt 候选 lib/src/simlab/）
  - 路由为本工程 Navigator.push（不是 /simlab/:simId）

acceptance_criteria:
  - AC-1: Intro / Compare / Mystery 三屏可进入、返回、再进入；屏间状态隔离
  - AC-2: Intro 材料/质量/体积/密度联动与 One/Two Blocks 与源码一致
  - AC-3: Compare Same Mass / Same Volume / Same Density 约束与四块默认数据一致
  - AC-4: Mystery Set 1/2/3/Random + Density Table 数据与源码一致
  - AC-5: 拖拽经 World 坐标 + 接触/浮力/重力 Solver；Painter 不改 Model
  - AC-6: flutter analyze 对本 sim 0 issues；专项测试通过；Pad 横屏无溢出
