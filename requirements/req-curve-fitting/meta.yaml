design_constraints:
  - MVC：DataPoint / DataSet / CurveModel / RegressionSolver / StatisticsSolver / MathCoordinateTransform / RenderData / Painter / Widget / Screen 分离
  - 禁止用教材公式重写加权最小二乘 / r² / χ²；必须移植本地 Curve.js
  - Painter 不计算拟合；Y 翻转只在 MathCoordinateTransform
  - NineGrid 只负责页面级外壳；模拟内部使用 PhET layoutBounds + FittedBox
  - 不修改其他 simulation；不修改 common API / 全局 Theme / Navigation / Home taxonomy
  - common 仅在语义真正通用时抽取（本 sim 为第 1 个 Curve Fitting 用户，图区自研）
  - 不用 Material Icon 冒充 PhET bucket / barometer geometry
  - 不为截图写死 pixel；不用 mean RGB 作为唯一视觉指标

acceptance_criteria:
  - AC-1: 单屏 Curve Fitting 可从 Home 进入、返回、再进入并重新初始化
  - AC-2: Linear/Quadratic/Cubic + Best Fit / Adjustable Fit 与源码一致
  - AC-3: Residuals / r² / reduced χ²（chiSquaredProperty）与 Curve.js 一致
  - AC-4: Data point drag / delta bars / bucket / reset 对照源码
  - AC-5: Graph MVT（inverted-Y scale 25.5）集中在 MathCoordinateTransform
  - AC-6: flutter analyze 0 issues；专项 regression/statistics/interaction 测试 + 回归通过
