design_constraints:
  - MVC：RootVector/Vector/SumVector/ComponentVector / Graph / MathCoordinateTransform / InteractionController / RenderData / Painter / Widget / Screen 分离
  - 禁止用教材公式重写 vector model；必须移植本地 RootVector ground truth（tail + xyComponents）
  - 禁止自创 resultant / component / snap / drag 语义
  - NineGrid 只负责页面级外壳；模拟内部使用局部数学坐标（+y 向上）+ 集中 MathCoordinateTransform
  - 不修改其他已完成 simulation
  - 不修改 common API / 全局 Theme / Navigation 架构（除非语义真正通用且经确认）
  - common 仅在语义真正通用时抽取（本 sim 为第 1 个 Vector Addition 用户）
  - 不用 Material Icon 冒充 PhET arrow/vector geometry
  - 不为截图写死 pixel；不用 mean RGB 作为唯一视觉指标
  - 本次只迁移 vector-addition（含其内置 Equations 屏）；不迁移独立产品 vector-addition-equations

acceptance_criteria:
  - AC-1: 四屏 Explore 1D / Explore 2D / Lab / Equations 可从 Home 进入、返回、再进入并重新初始化
  - AC-2: Vector Model（tail + xyComponents 为 canonical）与源码一致；tip/magnitude/angle 为 derived
  - AC-3: Sum/Resultant/ComponentStyle（invisible/triangle/parallelogram/projection）对照源码
  - AC-4: Graph bounds / origin drag / MODEL_TO_VIEW_SCALE / inverted-Y MVT 集中在 MathCoordinateTransform
  - AC-5: Cartesian/Polar snap、toolbox drag、Sum checkbox、Values、Angles、Reset 对照源码
  - AC-6: flutter analyze 0 issues；专项 vector/sum/transform 测试 + 回归通过

